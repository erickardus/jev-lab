[project]
name = "jev-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevlab"]
