<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Village</title>
<style>
  :root { --bg:#14161c; --panel:#1c1f27; --ink:#e8e6df; --muted:#8b8f9c; --line:#2a2e39; --accent:#4a86c8; --gold:#e4b04a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; display:flex; height:100vh; overflow:hidden; }
  #stage { position:relative; flex:0 0 auto; }
  canvas { display:block; cursor: crosshair; image-rendering: pixelated; }
  #hint { position:absolute; left:10px; bottom:8px; color:rgba(255,255,255,.75); font-size:11px; text-shadow:0 1px 2px #000; pointer-events:none; }
  #panel { flex:1; min-width:360px; max-width:480px; background:var(--panel); border-left:1px solid var(--line); padding:14px 16px; overflow-y:auto; }
  h1 { font-size:14px; margin:0 0 4px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  h2 { font-size:11px; margin:14px 0 6px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .clock { font-size:26px; margin-bottom:8px; }
  .clock small { font-size:12px; color:var(--muted); margin-left:8px; }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  button { background:#2a2e39; color:var(--ink); border:1px solid #363b48; border-radius:4px; padding:4px 9px; font:inherit; cursor:pointer; }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.wave { background:#2f5a3f; border-color:#3f7a54; }
  .npc { border-top:1px solid var(--line); padding:8px 0; cursor:pointer; }
  .npc:hover { background:rgba(255,255,255,.02); }
  .npc.sel { background:rgba(74,134,200,.08); margin:0 -16px; padding:8px 16px; }
  .head { display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .name { font-weight:600; }
  .role { color:var(--muted); }
  .doing { margin:3px 0 4px; color:#d7d3c6; }
  .needs { display:flex; gap:10px; color:var(--muted); font-size:11px; flex-wrap:wrap; }
  .needs span b { color:var(--ink); font-weight:500; }
  .bar { display:flex; align-items:center; gap:6px; font-size:11px; margin:2px 0; }
  .bar .lab { width:130px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .track { flex:1; height:6px; background:#2a2e39; border-radius:3px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--accent); }
  .bar.top .fill { background:var(--gold); }
  .bar .val { width:34px; text-align:right; color:var(--muted); }
  .opt { margin:4px 0 6px 0; padding:4px 8px; border-left:2px solid #2a2e39; font-size:11px; color:var(--muted); }
  .opt b { color:var(--ink); font-weight:500; }
  .opt.top { border-left-color: var(--gold); }
  .mem, .small { margin-top:4px; color:var(--muted); font-size:11px; }
  pre.saw { background:#14161c; border:1px solid var(--line); border-radius:4px; padding:8px; font-size:10.5px; color:#b9bcc7; white-space:pre-wrap; margin:6px 0 0; max-height:260px; overflow:auto; }
  .news div { font-size:11px; color:var(--muted); margin:2px 0; }
  .news b { color:var(--ink); font-weight:500; }
  .events { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; color:var(--muted); font-size:11px; }
  .events div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .events .say { color:#c9c2a8; }
  .stats { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; color:var(--muted); font-size:11px; }
  .stats b { color:var(--ink); font-weight:500; }
  .weather { color:#9fb8d8; }
  .trait.new { color:var(--gold); }
  .commit { color:#c9b06a; font-size:11px; margin-top:3px; }
  .inc { border-left:2px solid #c25a5a; padding:4px 8px; margin:4px 0; font-size:11px; color:var(--muted); }
  .inc.done { border-left-color:#5aa64a; } .inc.failed { border-left-color:#666; }
  .inc b { color:var(--ink); font-weight:500; }
  .helpers { display:flex; gap:6px; flex-wrap:wrap; margin-top:3px; }
  .helpers span { background:#2a2e39; border-radius:3px; padding:1px 5px; }
  .tabs { display:flex; gap:4px; margin:10px 0 4px; }
  .tabs button { font-size:11px; padding:2px 8px; }
  #chron { font-size:11px; color:var(--muted); max-height:60vh; overflow:auto; border-top:1px solid var(--line); padding-top:6px; }
  #chron .dayhdr { color:var(--ink); font-weight:600; margin:8px 0 2px; }
  #chron .change { color:var(--gold); } #chron .reflection { color:#7f8594; }
  .lt { color:#c9b06a; }
  #chat { border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0 4px; background:#171a21; }
  #chat .who { color:var(--muted); font-size:11px; margin-bottom:4px; display:flex; justify-content:space-between; }
  #chat .log { max-height:150px; overflow:auto; font-size:12px; margin-bottom:6px; }
  #chat .log div { margin:2px 0; } #chat .log .me { color:#8fd3a8; } #chat .log .them { color:var(--ink); }
  #chat form { display:flex; gap:6px; }
  #chat input { flex:1; background:#0f1116; color:var(--ink); border:1px solid #363b48; border-radius:4px; padding:5px 8px; font:inherit; }
  #chat .status { color:var(--muted); font-size:11px; margin-top:4px; min-height:14px; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><div id="hint">click the map to walk · click a villager to see why</div>
<div id="stale" hidden style="position:absolute;top:10px;left:10px;background:#c25a5a;color:#fff;padding:6px 10px;border-radius:5px;font-size:12px">the server is running an older build than this page — restart it (Ctrl-C, then <code>uv run examples/village/server.py</code>)</div></div>
<div id="panel">
  <h1>Village</h1>
  <div class="clock"><span id="hhmm">--:--</span><small id="label"></small></div>
  <div class="controls">
    <button id="pause">pause</button>
    <button data-speed="1" class="speed on">1×</button>
    <button data-speed="2" class="speed">2×</button>
    <button data-speed="4" class="speed">4×</button>
    <button data-brain="jev" class="brain">brain: jev</button>
    <button data-brain="random" class="brain">random</button>
    <button id="wave" class="wave">👋 wave</button>
  </div>
  <div id="chat" hidden>
    <div class="who"><span id="chat-who"></span><button id="chat-end" style="font-size:11px;padding:1px 6px">end</button></div>
    <div class="log" id="chat-log"></div>
    <form id="chat-form"><input id="chat-input" autocomplete="off" placeholder="say something to them…" maxlength="300"><button type="submit">send</button></form>
    <div class="status" id="chat-status"></div>
  </div>
  <div class="tabs"><button id="tab-live" class="on">live</button><button id="tab-chron">chronicle</button></div>
  <div id="live">
  <div id="npcs"></div>
  <h2>incidents</h2>
  <div id="incidents"></div>
  <h2>news · who knows</h2>
  <div class="news" id="news"></div>
  <div class="events" id="events"></div>
  </div>
  <div id="chron" hidden></div>
  <div class="stats" id="stats"></div>
</div>
<script>
const TILE = 28;
const EXPECT_BUILD = 4;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
let map = null, state = null, prevState = null, stateAt = 0, prevAt = 0, selected = null, tick = 0;
let mapLayer = null; // pre-rendered static tiles
const facing = {};   // npc id -> -1 (left) | 1 (right)
const rain = Array.from({length: 160}, () => ({x: Math.random(), y: Math.random(), v: 0.6 + Math.random()*0.6}));

// ---------------------------------------------------------------- network
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'map') { map = msg; canvas.width = map.w * TILE; canvas.height = map.h * TILE; mapLayer = renderMapLayer(); document.getElementById('stale').hidden = (msg.build || 0) >= EXPECT_BUILD; }
  else if (msg.type === 'state') { prevState = state; prevAt = stateAt; state = msg; stateAt = performance.now(); renderPanel(); }
};
const send = (o) => ws.readyState === 1 && ws.send(JSON.stringify(o));
document.getElementById('pause').onclick = () => send({cmd:'pause'});
document.getElementById('wave').onclick = () => send({cmd:'wave'});
let tab = 'live';
document.getElementById('chat-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = document.getElementById('chat-input'); const text = inp.value.trim();
  if (!text || !selected) return;
  send({cmd:'say', to: selected, text}); inp.value = '';
  chatLocal.push(['Traveler', text]); renderChat();
});
document.getElementById('chat-end').onclick = () => { send({cmd:'end_chat'}); selected = null; renderPanel(); };
let chatLocal = [];  // messages typed but not yet echoed by the server
function renderChat() {
  const box = document.getElementById('chat');
  const n = state && state.npcs.find(x => x.id === selected && !x.controlled);
  box.hidden = !n;
  if (!n) return;
  const c = state.chat || {};
  const active = c.with === n.id;
  document.getElementById('chat-who').textContent = `talk to ${n.name}` + (active ? '' : ' — type to walk over and speak');
  const log = active ? c.log : [];
  const pending = chatLocal.filter(([, t]) => !log.some(([w, tt]) => w === 'Traveler' && tt === t));
  const rows = log.concat(pending);
  const el = document.getElementById('chat-log');
  el.innerHTML = rows.map(([w, t]) => `<div class="${w === 'Traveler' ? 'me' : 'them'}"><b>${esc(w)}:</b> ${esc(t)}</div>`).join('') || '<div style="color:#8b8f9c">nothing said yet</div>';
  el.scrollTop = el.scrollHeight;
  document.getElementById('chat-status').textContent = active ? ({walking: 'walking over…', thinking: `${n.name} is thinking…`, talking: ''}[c.status] ?? c.status) : '';
  if (rows.length > 20) chatLocal = chatLocal.slice(-5);
}
document.getElementById('tab-live').onclick = () => { tab = 'live'; renderPanel(); };
document.getElementById('tab-chron').onclick = () => { tab = 'chron'; renderPanel(); };
document.querySelectorAll('.speed').forEach(b => b.onclick = () => { send({cmd:'speed', value:+b.dataset.speed}); document.querySelectorAll('.speed').forEach(x=>x.classList.toggle('on', x===b)); });
document.querySelectorAll('.brain').forEach(b => b.onclick = () => send({cmd:'brain', value:b.dataset.brain}));

// The panel re-renders 10x/s, so a `click` (mousedown + mouseup on the same node) can be lost
// when the node is replaced in between. Delegate pointerdown on the container instead.
document.getElementById('npcs').addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.npc'); if (!card) return;
  selected = selected === card.dataset.id ? null : card.dataset.id; renderPanel();
});

canvas.addEventListener('pointerdown', (e) => {
  if (!state || e.button !== 0) return;
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * (canvas.width / r.width), py = (e.clientY - r.top) * (canvas.height / r.height);
  const pos = positions();
  const hit = state.npcs.find(n => !n.controlled && Math.hypot(pos[n.id].cx - px, pos[n.id].cy - py) < 16);
  if (hit) { selected = selected === hit.id ? null : hit.id; renderPanel(); return; }
  send({cmd:'move', x: Math.floor(px / TILE), y: Math.floor(py / TILE)});
});

// ---------------------------------------------------------------- tiles (pre-rendered once)
function rng(seed) { let t = seed + 0x6D2B79F5; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const at = (x, y) => (map && y >= 0 && y < map.h && x >= 0 && x < map.w) ? map.rows[y][x] : '#';
const isWall = (c) => c === 'H';
const isDoor = (c) => 'abcdefTB'.includes(c);
const isGround = (c) => '.:MWFabcdefTB'.includes(c);

function renderMapLayer() {
  const off = document.createElement('canvas'); off.width = map.w * TILE; off.height = map.h * TILE;
  const g = off.getContext('2d'); g.imageSmoothingEnabled = false;
  const rand = rng(7);
  // pass 1: ground
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
    const ch = at(x, y), X = x*TILE, Y = y*TILE;
    // grass everywhere as a base
    g.fillStyle = '#5c8a3c'; g.fillRect(X, Y, TILE, TILE);
    for (let i = 0; i < 5; i++) { g.fillStyle = rand() < 0.5 ? '#54803a' : '#66964a'; g.fillRect(X + (rand()*TILE|0), Y + (rand()*TILE|0), 2, 2); }
    if (ch === ':' || ch === 'M' || isDoor(ch)) {
      g.fillStyle = '#b39a6b'; g.fillRect(X, Y, TILE, TILE);
      for (let i = 0; i < 6; i++) { g.fillStyle = rand() < 0.5 ? '#a68d5f' : '#c4ab7c'; g.fillRect(X + (rand()*(TILE-3)|0), Y + (rand()*(TILE-3)|0), 3, 2); }
      // soft grass edge where the path meets grass
      g.fillStyle = 'rgba(92,138,60,.55)';
      if (at(x, y-1) === '.') g.fillRect(X, Y, TILE, 3);
      if (at(x, y+1) === '.') g.fillRect(X, Y+TILE-3, TILE, 3);
      if (at(x-1, y) === '.') g.fillRect(X, Y, 3, TILE);
      if (at(x+1, y) === '.') g.fillRect(X+TILE-3, Y, 3, TILE);
    }
    if (ch === 'M') { // cobbles on the square
      g.fillStyle = '#9d8760'; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) g.fillRect(X + i*7 + 1, Y + j*7 + 1, 5, 5);
    }
    if (ch === 'F') {
      g.fillStyle = '#7a5a2e'; g.fillRect(X, Y, TILE, TILE);
      g.fillStyle = '#6a4c24'; for (let r = 0; r < 4; r++) g.fillRect(X, Y + r*7 + 5, TILE, 2);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) { g.fillStyle = rand() < 0.3 ? '#e2c05a' : '#cfa943'; g.fillRect(X + c*7 + 2, Y + r*7 + 1, 2, 5); g.fillStyle = '#f1d97a'; g.fillRect(X + c*7 + 2, Y + r*7 + 1, 2, 1); }
    }
    if (ch === '~') { g.fillStyle = '#3d78b4'; g.fillRect(X, Y, TILE, TILE); if (at(x,y-1) !== '~') { g.fillStyle = '#7fb2e0'; g.fillRect(X, Y, TILE, 2); } if (at(x,y+1) !== '~') { g.fillStyle = '#2d5f92'; g.fillRect(X, Y+TILE-2, TILE, 2); } }
    if (ch === 'W') { g.fillStyle = '#9d8760'; g.fillRect(X, Y, TILE, TILE); }
  }
  // pass 2: things that stand on the ground (trees, buildings), drawn top to bottom
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) {
    const ch = at(x, y), X = x*TILE, Y = y*TILE, cx = X + TILE/2, cy = Y + TILE/2;
    if (ch === '#') {
      g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(cx+2, cy+9, 11, 5, 0, 0, 7); g.fill();
      g.fillStyle = '#4a3320'; g.fillRect(cx-2, cy+2, 4, 8);
      g.fillStyle = '#2f6b2c'; g.beginPath(); g.arc(cx, cy-1, 11, 0, 7); g.fill();
      g.fillStyle = '#3f8a37'; g.beginPath(); g.arc(cx-2, cy-4, 8, 0, 7); g.fill();
      g.fillStyle = '#5aa64a'; g.beginPath(); g.arc(cx-4, cy-6, 4, 0, 7); g.fill();
    }
    if (isWall(ch)) {
      const roof = !isWall(at(x, y-1));
      if (roof) {
        g.fillStyle = '#8b3f33'; g.fillRect(X, Y, TILE, TILE);
        g.fillStyle = '#a5503f'; for (let r = 0; r < TILE; r += 6) g.fillRect(X, Y + r, TILE, 2);
        g.fillStyle = '#6e2f26'; g.fillRect(X, Y + TILE - 3, TILE, 3);
        if (!isWall(at(x-1, y))) { g.fillStyle = '#c0655a'; g.fillRect(X, Y, 3, TILE); }
        if (!isWall(at(x+1, y))) { g.fillStyle = '#6e2f26'; g.fillRect(X + TILE - 3, Y, 3, TILE); }
      } else {
        g.fillStyle = '#d9c39a'; g.fillRect(X, Y, TILE, TILE);
        g.fillStyle = '#5a3b26'; g.fillRect(X, Y, TILE, 2); g.fillRect(X, Y + TILE - 2, TILE, 2);
        if (!isWall(at(x-1, y))) g.fillRect(X, Y, 2, TILE);
        if (!isWall(at(x+1, y))) g.fillRect(X + TILE - 2, Y, 2, TILE);
        // a window unless there's a door below
        if (!isDoor(at(x, y+1))) { g.fillStyle = '#5a3b26'; g.fillRect(cx-6, cy-6, 12, 12); g.fillStyle = '#9fc7e8'; g.fillRect(cx-4, cy-4, 4, 4); g.fillRect(cx, cy-4, 4, 4); g.fillRect(cx-4, cy, 4, 4); g.fillRect(cx, cy, 4, 4); }
      }
    }
    if (isDoor(ch)) {
      // door in the wall above; this tile is the step
      const wx = X, wy = Y - TILE;
      g.fillStyle = '#5a3b26'; g.fillRect(wx + 8, wy + 8, 12, 20);
      g.fillStyle = '#8a5a35'; g.fillRect(wx + 10, wy + 10, 8, 18);
      g.fillStyle = '#e4b04a'; g.fillRect(wx + 16, wy + 20, 2, 2);
      if (ch === 'T') { g.fillStyle = '#e4b04a'; g.beginPath(); g.arc(wx + 24, wy + 12, 3, 0, 7); g.fill(); } // tavern lantern
      if (ch === 'B') { g.fillStyle = '#f3efe2'; g.fillRect(wx + 3, wy + 10, 5, 6); g.fillStyle = '#c9a94a'; g.fillRect(wx + 4, wy + 11, 3, 4); } // bread sign
    }
    if (ch === 'W') {
      g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(cx, cy+8, 12, 5, 0, 0, 7); g.fill();
      g.fillStyle = '#6f7580'; g.beginPath(); g.arc(cx, cy+2, 11, 0, 7); g.fill();
      g.fillStyle = '#2a3f55'; g.beginPath(); g.arc(cx, cy+2, 7, 0, 7); g.fill();
      g.fillStyle = '#5a3b26'; g.fillRect(cx-11, cy-12, 3, 16); g.fillRect(cx+8, cy-12, 3, 16);
      g.fillStyle = '#8b3f33'; g.fillRect(cx-14, cy-15, 28, 4);
    }
  }
  return off;
}

// ---------------------------------------------------------------- sprites (procedural pixel art)
// 12x16 templates. H hair, S skin, E eye, T tunic, P pants, B boots, A hat (traveler), . empty
const BODY = [
  '....HHHH....','...HHHHHH...','...HSSSSH...','...SESSES...','...SSSSSS...','....SSSS....',
  '...TTTTTT...','..TTTTTTTT..','.STTTTTTTTS.','.STTTTTTTTS.','...TTTTTT...','...TTTTTT...'];
const LEGS = [
  ['...PPPPPP...','...PP..PP...','...BB..BB...','............'],            // standing
  ['...PPPPPP...','..PP....PP..','.BB......BB.','............'],            // stride
  ['...PPPPPP...','...PP..PP...','....BBBB....','............'],            // pass
];
const HAT = ['.....A......','....AAA.....','...AAAAA....','..AAAAAAA...'];
const spriteCache = {};
function sprite(n, frame) {
  const key = `${n.id}|${frame}`;
  if (spriteCache[key]) return spriteCache[key];
  const pal = palette(n);
  const rows = (n.controlled ? HAT : []).concat(BODY, LEGS[frame]);
  const c = document.createElement('canvas'); c.width = 12; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return (spriteCache[key] = c);
}
function palette(n) {
  const hair = {mira:'#e8c15a', bram:'#5a3b26', sela:'#7a2a2a', tom:'#d8d8d8', nell:'#2b2b2b', pip:'#c9652a', traveler:'#4a3320'}[n.id] || '#3b2a1a';
  return { H: hair, S: '#f0c9a0', E: '#1b1b1b', T: n.color, P: n.id === 'pip' ? '#3a5a8a' : '#4a4a5a', B: '#3a2a1a', A: '#2f8f5f' };
}

// ---------------------------------------------------------------- positions: interpolate between snapshots
function positions() {
  // Render one snapshot behind and lerp toward the latest: smooth at any broadcast rate.
  const now = performance.now();
  const span = Math.max(1, stateAt - prevAt);
  const a = prevState ? Math.min(1, (now - stateAt) / span) : 1;
  const prev = Object.fromEntries((prevState ? prevState.npcs : []).map(n => [n.id, n]));
  const byTile = {};
  const raw = {};
  for (const n of state.npcs) {
    const p = prev[n.id] || n;
    const x = p.x + (n.x - p.x) * a, y = p.y + (n.y - p.y) * a;
    if (Math.abs(n.x - p.x) > 0.01) facing[n.id] = n.x > p.x ? 1 : -1;
    raw[n.id] = {x, y};
    const key = `${Math.round(n.x)},${Math.round(n.y)}`;
    (byTile[key] = byTile[key] || []).push(n.id);
  }
  const out = {};
  for (const ids of Object.values(byTile)) ids.forEach((id, i) => {
    const k = ids.length, off = k > 1 ? (i - (k - 1) / 2) * 13 : 0;
    out[id] = {cx: raw[id].x*TILE + TILE/2 + off, cy: raw[id].y*TILE + TILE/2 + (k > 1 ? (i % 2) * 4 : 0)};
  });
  return out;
}

// ---------------------------------------------------------------- drawing
function bubble(text, cx, cy, fill, ink, maxW) {
  ctx.font = '11px ui-monospace, monospace';
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  const w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width))) + 14;
  const h = lines.length * 13 + 9;
  const x = Math.max(2, Math.min(canvas.width - w - 2, cx - w/2)), y = Math.max(2, cy - h - 8);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 2;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, 6); ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx-5, y+h-1); ctx.lineTo(cx, y+h+6); ctx.lineTo(cx+5, y+h-1); ctx.fill();
  ctx.restore();
  ctx.fillStyle = ink; ctx.textAlign = 'left';
  lines.forEach((l, i) => ctx.fillText(l, x + 7, y + 13 + i*13));
  ctx.textAlign = 'center';
}

function drawWater() {
  for (let y = 0; y < map.h; y++) for (let x = 0; x < map.w; x++) if (at(x, y) === '~') {
    const X = x*TILE, Y = y*TILE;
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    const ph = (tick/18 + x*0.9 + y*0.6);
    ctx.fillRect(X + 4 + Math.sin(ph)*4, Y + 8, 10, 2);
    ctx.fillRect(X + 12 + Math.cos(ph*0.8)*4, Y + 19, 8, 2);
  }
}

function drawNpcs() {
  const pos = positions();
  const order = [...state.npcs].sort((a, b) => pos[a.id].cy - pos[b.id].cy); // painter's order
  for (const n of order) {
    const {cx, cy} = pos[n.id];
    const scale = n.role === 'kid' ? 2 : 2.4;
    const frame = n.moving ? (Math.floor(tick / 7) % 2 ? 1 : 2) : 0;
    const img = sprite(n, frame);
    const w = img.width * scale, h = img.height * scale;
    const idle = n.moving ? 0 : Math.sin(tick / 30 + cx) * 0.6;
    ctx.globalAlpha = n.asleep ? 0.55 : 1;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(cx, cy + 12, w*0.38, 4, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(cx, cy + 12 - h + idle);
    if ((facing[n.id] || 1) < 0) { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(img, -w/2 * ((facing[n.id] || 1) < 0 ? -1 : 1) - (((facing[n.id] || 1) < 0) ? w : 0), 0, w, h);
    ctx.restore();
    if (selected === n.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(cx, cy + 12, w*0.5, 6, 0, 0, 7); ctx.stroke(); }
    if (n.deciding) { ctx.fillStyle = '#fff'; for (let i=0;i<3;i++) { const ph = (tick/6 + i) % 3; ctx.globalAlpha = ph < 1 ? 1 : 0.35; ctx.beginPath(); ctx.arc(cx-6+i*6, cy - h + 4, 1.7, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
    if (n.knows.length) { ctx.fillStyle = '#e4b04a'; ctx.beginPath(); ctx.arc(cx+11, cy-h+14, 4.5, 0, 7); ctx.fill(); ctx.fillStyle = '#1b1b1b'; ctx.font = 'bold 8px ui-monospace'; ctx.textAlign = 'center'; ctx.fillText(n.knows.length, cx+11, cy-h+17); }
    ctx.font = '10px ui-monospace, monospace'; ctx.textAlign = 'center';
    const lw = ctx.measureText(n.name).width + 6;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(cx - lw/2, cy + 15, lw, 12);
    ctx.fillStyle = '#f3efe2'; ctx.fillText(n.name, cx, cy + 24);
    ctx.globalAlpha = 1;
  }
  // Bubbles: collect every bubble, then lay them out so none overlap (speech has priority,
  // then thoughts left to right; a bubble that would collide is pushed up).
  const wanted = [];
  for (const n of state.npcs) {
    const {cx, cy} = pos[n.id];
    if (n.bubble) { wanted.push({n, cx, cy, text: n.bubble, fill: '#f7f3e8', ink: '#1b1b1b', w: 190, pri: 0}); continue; }
    let text = null, ink = '#d7d3c6', w = 190;
    if (n.asleep) { text = 'z z z'; ink = '#9fb8d8'; w = 60; }
    else if (n.talking_to) { text = '…'; w = 40; }
    else if (!n.controlled && n.action && Object.keys(n.probs).length) { const [, p] = Object.entries(n.probs)[0]; text = `${n.action_label} · ${Math.round(p*100)}%`; w = 260; }
    if (text) wanted.push({n, cx, cy, text, fill: 'rgba(20,22,28,.82)', ink, w, pri: 1});
  }
  wanted.sort((a, b) => a.pri - b.pri || a.cx - b.cx);
  const placed = [...labelRects];
  for (const b of wanted) {
    if (b.pri === 1 && wanted.some(o => o !== b && o.pri === 1 && Math.abs(o.cx - b.cx) < 40 && Math.abs(o.cy - b.cy) < 30)) b.text = `${b.n.name}: ${b.text}`;
    const box = bubbleBox(b.text, b.cx, b.cy - 26, b.w);
    let lift = 0;
    for (let tries = 0; tries < 12; tries++) {
      const r = {x: box.x, y: box.y - lift, w: box.w, h: box.h};
      const hit = placed.find(q => r.x < q.x + q.w && r.x + r.w > q.x && r.y < q.y + q.h + 4 && r.y + r.h + 4 > q.y);
      if (!hit) { placed.push(r); bubble(b.text, b.cx, b.cy - 26 - lift, b.fill, b.ink, b.w); break; }
      lift = (box.y + box.h) - hit.y + 6;  // move just above the bubble we hit
    }
  }
}

function bubbleBox(text, cx, cy, maxW) {
  ctx.font = '11px ui-monospace, monospace';
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  const w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width))) + 14, h = lines.length * 13 + 9;
  return {x: Math.max(2, Math.min(canvas.width - w - 2, cx - w/2)), y: Math.max(2, cy - h - 8), w, h};
}

function drawLabelsAndLight() {
  const dark = 1 - state.clock.daylight;
  if (dark > 0.2) {
    for (const p of map.places) {
      if (p.kind !== 'home') continue;
      const inside = state.npcs.some(n => n.asleep && Math.round(n.x) === p.x && Math.round(n.y) === p.y);
      if (!inside) continue;
      const wx = (p.x-1)*TILE + TILE/2, wy = (p.y-2)*TILE + TILE/2, wx2 = (p.x+1)*TILE + TILE/2;
      ctx.fillStyle = `rgba(255,200,90,${0.85*dark})`; ctx.fillRect(wx-4, wy-4, 8, 8); ctx.fillRect(wx2-4, wy-4, 8, 8);
      const gl = ctx.createRadialGradient(wx, wy, 2, wx, wy, 30); gl.addColorStop(0, `rgba(255,200,90,${0.35*dark})`); gl.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = gl; ctx.fillRect(wx-30, wy-30, 60, 60);
    }
  }
}

let labelRects = [];
function drawPlaceLabels() {
  labelRects = [];
  ctx.font = '11px ui-monospace, monospace'; ctx.textAlign = 'center';
  for (const p of map.places) {
    if (p.kind === 'home') continue;
    const w = ctx.measureText(p.name).width + 10, X = p.x*TILE + TILE/2, Y = p.y*TILE - (p.kind === 'well' ? 24 : 18);
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.beginPath(); ctx.roundRect(X - w/2, Y - 11, w, 15, 3); ctx.fill();
    ctx.fillStyle = '#f3efe2'; ctx.fillText(p.name, X, Y);
    labelRects.push({x: X - w/2, y: Y - 11, w, h: 15});
  }
}

function drawWeather() {
  const dark = 1 - state.clock.daylight;
  const h = parseInt(state.clock.hhmm) + parseInt(state.clock.hhmm.slice(3)) / 60;
  const dusk = h > 16.5 && h < 20 ? Math.sin((h - 16.5) / 3.5 * Math.PI) : h > 5 && h < 7.5 ? Math.sin((h - 5) / 2.5 * Math.PI) : 0;
  if (dusk > 0) { ctx.fillStyle = `rgba(255,140,60,${dusk*0.18})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (dark > 0) { ctx.fillStyle = `rgba(12,16,48,${dark*0.55})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  if (state.weather === 'raining') {
    ctx.fillStyle = 'rgba(40,60,90,.22)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(200,220,255,.5)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const d of rain) { d.y = (d.y + d.v * 0.02) % 1; const x = d.x*canvas.width, y = d.y*canvas.height; ctx.moveTo(x, y); ctx.lineTo(x-2, y+9); }
    ctx.stroke();
  }
}

function frame() {
  tick++;
  if (map && state && mapLayer) {
    ctx.drawImage(mapLayer, 0, 0);
    drawWater();
    drawPlaceLabels();
    drawNpcs();
    drawLabelsAndLight();
    drawWeather();
  }
  requestAnimationFrame(frame);
}
frame();

function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let names = {};
function npcCard(n) {
  const sel = selected === n.id;
  const probs = Object.entries(n.all_probs).sort((a,b) => b[1]-a[1]);
  const shown = sel ? probs : probs.slice(0, 3);
  const top = probs[0] ? probs[0][0] : null;
  return `
    <div class="npc ${sel ? 'sel' : ''}" data-id="${n.id}">
      <div class="head"><span class="dot" style="background:${n.color}"></span><span class="name">${n.name}</span><span class="role">${esc(n.role)} · ${n.traits.map(t => `<span class="trait ${n.original_traits && !n.original_traits.includes(t) ? 'new' : ''}">${esc(t)}</span>`).join(', ')}</span></div>
      <div class="doing">${esc(n.action_label)}${n.deciding ? ' <span style="color:#8b8f9c">· thinking…</span>' : ''}</div>
      ${n.controlled ? `<div class="mem">${n.memory.slice(-3).map(m => '· ' + esc(m)).join('<br>')}</div>` : `
      <div class="needs">${Object.entries(n.needs_words).map(([k,v]) => `<span>${k} <b>${v}</b></span>`).join('')} <span>mood <b>${n.mood.toFixed(1)}</b></span>${n.knows.length ? `<span>knows <b>${n.knows.length}</b> news</span>` : ''}${n.help_p > 0 ? `<span>would help <b>${n.help_p.toFixed(2)}</b></span>` : ''}</div>
      ${n.commitments.length ? `<div class="commit">${n.commitments.map(c => `promised ${names[c.to] || c.to}: ${esc(c.what)}`).join('<br>')}</div>` : ''}
      <div class="probs">${shown.map(([k,p]) => sel
        ? `<div class="opt ${k===top?'top':''}"><b>${k}</b> · ${p.toFixed(2)}<br>${esc(n.options[k] || '')}</div>`
        : `<div class="bar ${k===top?'top':''}"><span class="lab">${k}</span><span class="track"><span class="fill" style="width:${Math.round(p*100)}%"></span></span><span class="val">${p.toFixed(2)}</span></div>`).join('')}
        ${probs.length ? `<div class="bar"><span class="lab">confidence</span><span class="track"><span class="fill" style="width:${Math.round(n.confidence*100)}%;background:#8b8f9c"></span></span><span class="val">${n.confidence.toFixed(2)}</span></div>` : ''}
      </div>
      ${sel ? `
        ${n.long_term.length ? `<div class="small lt">remembers well:<br>${n.long_term.map(m => '· ' + esc(m)).join('<br>')}</div>` : ''}
        ${n.trait_log.length ? `<div class="small">has changed:<br>${n.trait_log.map(t => `· day ${t.day}: ${esc(t.change.replace('more_', 'more '))} (p=${t.p})`).join('<br>')}</div>` : ''}
        <div class="small">recently:<br>${n.memory.map(m => '· ' + esc(m)).join('<br>') || '—'}</div>
        <div class="small">last seen: ${Object.entries(n.last_seen).map(([k, v]) => `${names[k] || k} — ${esc(v)}`).join(' · ') || '—'}</div>
        <div class="small">journal (${n.journal.length} entries today and before):<br>${n.journal.slice(-12).map(j => `· d${j.day} ${j.hhmm} ${esc(j.text)}`).join('<br>')}</div>
        ${n.knows.length ? `<div class="small">has heard:<br>${n.knows.map(m => '· ' + esc(m)).join('<br>')}</div>` : ''}
        ${Object.keys(n.affinity).length ? `<div class="small">gets along with: ${Object.entries(n.affinity).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `${k} ${v.toFixed(1)}`).join(', ')}</div>` : ''}
        <div class="small">what Jev saw about ${n.name}:</div>
        <pre class="saw">${esc(JSON.stringify(sawOf(n), null, 1))}</pre>`
      : `<div class="mem">${n.memory.slice(-2).map(m => '· ' + esc(m)).join('<br>')}</div>`}`}
    </div>`;
}

function sawOf(n) {
  // reconstruct the villager slice of the state (mirrors NPC.describe on the server)
  const d = { role: n.role, traits: n.traits, feels: n.needs_words, doing: n.action_label, recently: n.memory };
  if (n.knows.length) d.has_heard = n.knows.slice(-4);
  if (n.commitments.length) d.promised = n.commitments.map(c => c.what);
  if (n.long_term.length) d.remembers_well = n.long_term.slice(-6);
  const friends = Object.entries(n.affinity).filter(([,v]) => v >= 0.4).map(([k]) => k);
  if (friends.length) d.gets_along_with = friends;
  return d;
}

function renderPanel() {
  names = Object.fromEntries(state.npcs.map(n => [n.id, n.name]));
  renderChat();
  document.getElementById('hhmm').textContent = `day ${state.day} · ${state.clock.hhmm}`;
  document.getElementById('tab-live').classList.toggle('on', tab === 'live');
  document.getElementById('tab-chron').classList.toggle('on', tab === 'chron');
  document.getElementById('live').hidden = tab !== 'live';
  const ch = document.getElementById('chron'); ch.hidden = tab !== 'chron';
  if (tab === 'chron') {
    const keep = ch.scrollTop, atBottom = ch.scrollHeight - ch.scrollTop - ch.clientHeight < 30;
    let out = '', day = null;
    for (const e of state.chronicle) {
      if (e.kind === 'day' || e.day !== day) { day = e.day; out += `<div class="dayhdr">Day ${day}</div>`; if (e.kind === 'day') continue; }
      out += `<div class="${e.kind}">${e.hhmm} ${esc(e.text)}</div>`;
    }
    ch.innerHTML = out; ch.scrollTop = atBottom ? ch.scrollHeight : keep;
    return;
  }
  document.getElementById('label').innerHTML = esc(state.clock.label) + (state.weather === 'raining' ? ' <span class="weather">· raining</span>' : '') + (state.paused ? ' · paused' : '');
  document.getElementById('pause').textContent = state.paused ? 'resume' : 'pause';
  document.querySelectorAll('.brain').forEach(b => b.classList.toggle('on', b.dataset.brain === state.brain.name));
  const el = document.getElementById('npcs');
  el.innerHTML = state.npcs.map(npcCard).join('');
  document.getElementById('incidents').innerHTML = state.incidents.length ? state.incidents.slice().reverse().map(i => `
    <div class="inc ${i.resolved ? 'done' : i.failed ? 'failed' : ''}"><b>${esc(i.text)}</b> — ${i.resolved ? 'resolved' : i.failed ? 'failed' : `${i.progress}/${i.needed} · ${i.left}s left`}<br>${esc(i.job)}
      <div class="helpers">${i.helpers.map(h => `<span>${names[h] || h}</span>`).join('')}${!i.resolved && !i.failed ? state.npcs.filter(n => !n.controlled && n.knows.includes(i.text) && n.help_p > 0).map(n => `<span style="opacity:.7">${n.name} would help ${n.help_p.toFixed(2)}</span>`).join('') : ''}</div>
    </div>`).join('') : '<div class="small">nothing has gone wrong yet</div>';
  document.getElementById('news').innerHTML = state.news.length
    ? state.news.slice().reverse().map(item => `<div><b>${esc(item.text)}</b> <span>(${item.since}${item.subject ? ` · about ${names[item.subject] || item.subject}` : ''})</span><br>known by: ${item.knows.map(id => names[id] || id).join(', ') || 'nobody yet'}</div>`).join('')
    : '<div>nothing has happened yet</div>';
  document.getElementById('events').innerHTML = state.events.slice().reverse().map(e => `<div class="${e.includes(': "') ? 'say' : ''}" style="${e.includes('has become') ? 'color:#e4b04a' : ''}">${esc(e)}</div>`).join('');
  const b = state.brain, nr = state.narrator;
  document.getElementById('stats').innerHTML =
    `brain <b>${b.name}</b> · <b>${b.requests}</b> requests · <b>${b.input_tokens.toLocaleString()}</b> tokens · <b>$${b.cost_usd.toFixed(4)}</b>${b.errors ? ` · ${b.errors} errors` : ''}<br>` +
    `narrator <b>${nr.name}</b> · <b>${nr.calls}</b> conversations${nr.cost_usd !== undefined ? ` · <b>$${nr.cost_usd.toFixed(4)}</b>` : ''}`;
}
</script>
</body>
</html>
